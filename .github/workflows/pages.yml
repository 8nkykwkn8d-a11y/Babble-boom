name: Deploy BUBBLE BOOM to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run inventory regression tests
        run: node --test tests/inventory.test.js
      - name: Check JavaScript syntax
        run: |
          node --check inventory-core.js
          node -e 'const fs=require("node:fs");const html=fs.readFileSync("index.html","utf8");const start=html.lastIndexOf("<script>");if(start<0)throw new Error("Inline app script not found");const bodyStart=start+8;const end=html.indexOf("</script>",bodyStart);if(end<0)throw new Error("Inline app script is not closed");fs.writeFileSync("/tmp/bubble-boom-app.js",html.slice(bodyStart,end));'
          node --check /tmp/bubble-boom-app.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
